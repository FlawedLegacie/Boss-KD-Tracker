name: Apply 0.11 tabbed dashboard patch

on:
  push:
    branches:
      - release/0.11.0-interface-data
    paths:
      - .github/workflows/apply-0.11-panel.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.11.0-interface-data

      - name: Apply panel patch
        run: python .github/scripts/apply_0_11_panel.py

      - name: Remove one-time patch files
        run: rm .github/scripts/apply_0_11_panel.py .github/workflows/apply-0.11-panel.yml

      - name: Commit interface changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bossdeathtracker/BossDeathTrackerPanel.java .github/scripts/apply_0_11_panel.py .github/workflows/apply-0.11-panel.yml
          git commit -m "Add tabbed dashboard, favorites, and filters"
          git push
