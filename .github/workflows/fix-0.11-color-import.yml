name: Fix 0.11 Data panel import

on:
  push:
    branches:
      - release/0.11.0-interface-data
    paths:
      - .github/workflows/fix-0.11-color-import.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.11.0-interface-data

      - name: Add missing Color import
        run: sed -i '/import java.awt.Component;/i import java.awt.Color;' src/main/java/com/bossdeathtracker/BossDataPanel.java

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-0.11-color-import.yml

      - name: Commit import fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bossdeathtracker/BossDataPanel.java .github/workflows/fix-0.11-color-import.yml
          git commit -m "Fix Data panel Color import"
          git push
