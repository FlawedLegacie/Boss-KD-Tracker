name: Apply 0.11 store consistency follow-up

on:
  push:
    branches:
      - release/0.11.0-interface-data
    paths:
      - .github/workflows/apply-0.11-store-followup.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.11.0-interface-data

      - name: Apply store follow-up
        run: python .github/scripts/apply_0_11_store_followup.py

      - name: Remove one-time patch files
        run: rm .github/scripts/apply_0_11_store_followup.py .github/workflows/apply-0.11-store-followup.yml

      - name: Commit consistency fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bossdeathtracker/BossDeathTrackerStore.java .github/scripts/apply_0_11_store_followup.py .github/workflows/apply-0.11-store-followup.yml
          git commit -m "Keep encounter undo and profile imports consistent"
          git push
