name: Apply player-death kill race fix

on:
  push:
    branches:
      - fix/player-death-kill-race
    paths:
      - player-death-race-fix.patch
      - .github/workflows/apply-player-death-race-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bugfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/player-death-kill-race
          fetch-depth: 0

      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check player-death-race-fix.patch
          git apply player-death-race-fix.patch
          grep -q 'KILL_CONFIRMATION_DELAY_TICKS = 2' src/main/java/com/bossdeathtracker/BossDeathTrackerPlugin.java
          grep -q 'private void confirmPendingKill()' src/main/java/com/bossdeathtracker/BossDeathTrackerPlugin.java
          grep -q 'pendingKill = null;' src/main/java/com/bossdeathtracker/BossDeathTrackerPlugin.java

      - name: Remove temporary patch machinery
        shell: bash
        run: |
          rm player-death-race-fix.patch
          rm .github/workflows/apply-player-death-race-fix.yml

      - name: Commit bugfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix player deaths being counted as boss kills'
          git push origin HEAD:fix/player-death-kill-race
