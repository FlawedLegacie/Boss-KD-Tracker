name: Apply 0.10 encounter store patch

on:
  push:
    branches:
      - release/0.10.0-encounters
    paths:
      - .github/workflows/apply-0.10-store.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.10.0-encounters

      - name: Add encounter persistence and statistics APIs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/bossdeathtracker/BossDeathTrackerStore.java')
          source = path.read_text(encoding='utf-8')

          kc_anchor = '''    public synchronized HistoricalKillSyncResult syncRuneLiteKillCounts(\n        ConfigManager sourceConfigManager)\n'''
          kc_method = '''    public synchronized Integer getCachedRuneLiteKillCount(\n        BossProfile boss)\n    {\n        if (boss == null\n            || configManager == null\n            || configManager.getRSProfileKey() == null)\n        {\n            return null;\n        }\n\n        Integer cachedKc = null;\n\n        for (String killcountKey :\n            BossNameResolver.runeLiteKillcountKeys(boss))\n        {\n            Integer candidate =\n                configManager.getRSProfileConfiguration(\n                    "killcount",\n                    killcountKey,\n                    int.class);\n\n            if (candidate != null\n                && candidate >= 0\n                && (cachedKc == null || candidate > cachedKc))\n            {\n                cachedKc = candidate;\n            }\n        }\n\n        return cachedKc;\n    }\n\n'''
          if kc_anchor not in source:
              raise SystemExit('KC anchor not found')
          source = source.replace(kc_anchor, kc_method + kc_anchor, 1)

          stats_anchor = '''    public synchronized void markEncounterVerified(String bossId)\n'''
          stats_methods = '''    public synchronized String beginEncounter(\n        String bossId,\n        String bossName,\n        int npcId,\n        Instant startedAt)\n    {\n        requireBoss(bossId);\n\n        for (int index = data.getAttempts().size() - 1; index >= 0; index--)\n        {\n            EncounterAttempt existing = data.getAttempts().get(index);\n            if (existing != null\n                && !existing.isCompleted()\n                && bossId.equals(existing.getBossId()))\n            {\n                return existing.getId();\n            }\n        }\n\n        EncounterAttempt attempt = EncounterAttempt.start(\n            bossId,\n            bossName,\n            npcId,\n            startedAt);\n        data.getAttempts().add(attempt);\n        queueSave();\n        return attempt.getId();\n    }\n\n    public synchronized void completeEncounter(\n        String encounterId,\n        EncounterOutcome outcome,\n        String completionSignal,\n        String note)\n    {\n        EncounterAttempt attempt = findAttemptLocked(encounterId);\n        if (attempt == null || attempt.isCompleted())\n        {\n            return;\n        }\n\n        EncounterOutcome resolved = outcome == null\n            ? EncounterOutcome.ABANDONED\n            : outcome;\n        Instant endedAt = Instant.now();\n        attempt.complete(\n            resolved,\n            endedAt,\n            completionSignal,\n            note);\n\n        BossProfile boss = requireBoss(attempt.getBossId());\n        boss.markEncounterVerified();\n\n        if (resolved.countsKill()\n            && !hasEncounterEventLocked(\n                encounterId,\n                TrackerEventType.KILL))\n        {\n            data.getEvents().add(TrackerEvent.createAt(\n                encounterId,\n                attempt.getBossId(),\n                TrackerEventType.KILL,\n                TrackerEventSource.AUTOMATIC,\n                1,\n                "Encounter outcome " + resolved\n                    + "; signal: " + safe(completionSignal),\n                endedAt));\n            boss.markKillVerified();\n        }\n\n        if (resolved.countsDeath()\n            && !hasEncounterEventLocked(\n                encounterId,\n                TrackerEventType.DEATH))\n        {\n            data.getEvents().add(TrackerEvent.createAt(\n                encounterId,\n                attempt.getBossId(),\n                TrackerEventType.DEATH,\n                TrackerEventSource.AUTOMATIC,\n                1,\n                "Encounter outcome " + resolved\n                    + "; signal: " + safe(completionSignal),\n                endedAt));\n            boss.markDeathVerified();\n        }\n\n        queueSave();\n    }\n\n    public synchronized void abandonEncounter(\n        String encounterId,\n        EncounterOutcome outcome,\n        String note)\n    {\n        EncounterOutcome resolved = outcome == EncounterOutcome.DISCONNECTED\n            ? EncounterOutcome.DISCONNECTED\n            : EncounterOutcome.ABANDONED;\n        completeEncounter(\n            encounterId,\n            resolved,\n            resolved.name(),\n            note);\n    }\n\n    public synchronized List<EncounterAttempt> getAttemptsForBoss(\n        String bossId)\n    {\n        List<EncounterAttempt> result = new ArrayList<>();\n\n        for (EncounterAttempt attempt : data.getAttempts())\n        {\n            if (attempt != null && bossId.equals(attempt.getBossId()))\n            {\n                result.add(attempt);\n            }\n        }\n\n        result.sort(Comparator.comparing(\n            EncounterAttempt::getStartedAt,\n            Comparator.nullsLast(Comparator.reverseOrder())));\n        return result;\n    }\n\n    public synchronized List<EncounterAttempt> getAllAttempts()\n    {\n        return new ArrayList<>(data.getAttempts());\n    }\n\n    public synchronized BossStatistics getBossStatistics(String bossId)\n    {\n        return BossStatistics.calculate(bossId, data.getAttempts());\n    }\n\n    public synchronized SessionStatistics getSessionStatistics(\n        Instant sessionStartedAt)\n    {\n        return SessionStatistics.calculate(\n            sessionStartedAt,\n            data.getAttempts());\n    }\n\n    private EncounterAttempt findAttemptLocked(String encounterId)\n    {\n        if (encounterId == null)\n        {\n            return null;\n        }\n\n        for (EncounterAttempt attempt : data.getAttempts())\n        {\n            if (attempt != null && encounterId.equals(attempt.getId()))\n            {\n                return attempt;\n            }\n        }\n\n        return null;\n    }\n\n    private boolean hasEncounterEventLocked(\n        String encounterId,\n        TrackerEventType type)\n    {\n        for (TrackerEvent event : data.getEvents())\n        {\n            if (event != null\n                && encounterId != null\n                && encounterId.equals(event.getEncounterId())\n                && type == event.getType()\n                && event.getAmount() > 0)\n            {\n                return true;\n            }\n        }\n\n        return false;\n    }\n\n'''
          if stats_anchor not in source:
              raise SystemExit('Statistics anchor not found')
          source = source.replace(stats_anchor, stats_methods + stats_anchor, 1)

          delete_old = '''    public synchronized void deleteBoss(String bossId)\n    {\n        data.getBosses().removeIf(boss -> boss.getId().equals(bossId));\n        data.getEvents().removeIf(event -> event.getBossId().equals(bossId));\n        queueSave();\n    }\n'''
          delete_new = '''    public synchronized void deleteBoss(String bossId)\n    {\n        data.getBosses().removeIf(boss -> boss.getId().equals(bossId));\n        data.getEvents().removeIf(event -> event.getBossId().equals(bossId));\n        data.getAttempts().removeIf(\n            attempt -> bossId.equals(attempt.getBossId()));\n        queueSave();\n    }\n'''
          if delete_old not in source:
              raise SystemExit('Delete-boss block not found')
          source = source.replace(delete_old, delete_new, 1)

          switch_old = '''        synchronized (this)\n        {\n            data = loadResult.data;\n            data.migrateToCurrent();\n            activeStorageKey = storageKey;\n            activeDataFile = targetFile;\n            loaded = true;\n            seedBuiltInDefinitionsLocked();\n        }\n\n        if (migrated || loadResult.recovered || !loadResult.existed)\n        {\n            flush();\n        }\n'''
          switch_new = '''        boolean staleAttemptsClosed;\n\n        synchronized (this)\n        {\n            data = loadResult.data;\n            data.migrateToCurrent();\n            activeStorageKey = storageKey;\n            activeDataFile = targetFile;\n            loaded = true;\n            seedBuiltInDefinitionsLocked();\n            staleAttemptsClosed = closeStaleAttemptsLocked();\n        }\n\n        if (migrated\n            || loadResult.recovered\n            || !loadResult.existed\n            || staleAttemptsClosed)\n        {\n            flush();\n        }\n'''
          if switch_old not in source:
              raise SystemExit('Profile-switch block not found')
          source = source.replace(switch_old, switch_new, 1)

          helper_anchor = '''    private void preserveCorruptPrimary(Path targetFile)\n'''
          helper = '''    private boolean closeStaleAttemptsLocked()\n    {\n        boolean changed = false;\n        Instant now = Instant.now();\n\n        for (EncounterAttempt attempt : data.getAttempts())\n        {\n            if (attempt != null && !attempt.isCompleted())\n            {\n                attempt.complete(\n                    EncounterOutcome.DISCONNECTED,\n                    now,\n                    "PROFILE_RELOAD",\n                    "Recovered unfinished attempt after reload");\n                changed = true;\n            }\n        }\n\n        return changed;\n    }\n\n'''
          if helper_anchor not in source:
              raise SystemExit('Recovery helper anchor not found')
          source = source.replace(helper_anchor, helper + helper_anchor, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-0.10-store.yml

      - name: Commit encounter store changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bossdeathtracker/BossDeathTrackerStore.java .github/workflows/apply-0.10-store.yml
          git commit -m "Persist encounter attempts and statistics"
          git push
