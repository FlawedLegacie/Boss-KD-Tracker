name: Apply 0.10 statistics dashboard v2

on:
  push:
    branches:
      - release/0.10.0-encounters
    paths:
      - .github/workflows/apply-0.10-dashboard-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.10.0-encounters

      - name: Apply dashboard patch
        run: python .github/scripts/apply_0_10_dashboard.py

      - name: Remove one-time patch files
        run: rm .github/scripts/apply_0_10_dashboard.py .github/workflows/apply-0.10-dashboard.yml .github/workflows/apply-0.10-dashboard-v2.yml

      - name: Commit dashboard changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bossdeathtracker/BossDeathTrackerPanel.java src/main/java/com/bossdeathtracker/BossDeathTrackerPlugin.java .github/scripts/apply_0_10_dashboard.py .github/workflows/apply-0.10-dashboard.yml .github/workflows/apply-0.10-dashboard-v2.yml
          git commit -m "Add encounter and session statistics dashboard"
          git push
