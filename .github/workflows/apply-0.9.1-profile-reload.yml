name: Apply 0.9.1 profile reload patch

on:
  push:
    branches:
      - release/0.9.1-reliability
    paths:
      - .github/workflows/apply-0.9.1-profile-reload.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/0.9.1-reliability

      - name: Patch profile reload behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/java/com/bossdeathtracker/BossDeathTrackerPlugin.java')
          source = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\n        store\.loadAsync\(error ->.*?\n            \}\)\);\n',
              re.S,
          )
          source, count = pattern.subn(
              '\n        loadCurrentProfileData();\n',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one startup load block, found {count}')

          method = '''    private void loadCurrentProfileData()\n    {\n        store.loadCurrentProfileAsync(error ->\n            SwingUtilities.invokeLater(() ->\n            {\n                if (error != null)\n                {\n                    log.warn(\n                        "Boss Death Tracker profile load completed with an error",\n                        error);\n                }\n\n                BossDeathTrackerStore.HistoricalKillSyncResult syncResult =\n                    store.syncRuneLiteKillCounts(configManager);\n\n                if (syncResult.getBossesUpdated() > 0)\n                {\n                    log.info(\n                        "Synchronized {} historical kills across {} bosses",\n                        syncResult.getKillsImported(),\n                        syncResult.getBossesUpdated());\n                }\n\n                if (panel != null)\n                {\n                    panel.refresh();\n                }\n            }));\n    }\n\n'''

          anchor = '    @Override\n    protected void shutDown()'
          if anchor not in source:
              raise SystemExit('Unable to find shutDown anchor')
          source = source.replace(anchor, method + anchor, 1)

          state_anchor = '''        GameState state = event.getGameState();\n\n        if (state == GameState.LOGIN_SCREEN'''
          state_replacement = '''        GameState state = event.getGameState();\n\n        if (state == GameState.LOGGED_IN)\n        {\n            loadCurrentProfileData();\n            return;\n        }\n\n        if (state == GameState.LOGIN_SCREEN'''
          if state_anchor not in source:
              raise SystemExit('Unable to find game-state anchor')
          source = source.replace(state_anchor, state_replacement, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove one-time patch workflow
        run: rm .github/workflows/apply-0.9.1-profile-reload.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bossdeathtracker/BossDeathTrackerPlugin.java .github/workflows/apply-0.9.1-profile-reload.yml
          git commit -m "Reload per-character data on login"
          git push
