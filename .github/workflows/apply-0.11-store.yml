name: Apply 0.11 data management patch

on:
  push:
    branches:
      - release/0.11.0-interface-data
    paths:
      - .github/workflows/apply-0.11-store.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.11.0-interface-data

      - name: Apply store patch
        run: python .github/scripts/apply_0_11_store.py

      - name: Remove one-time patch files
        run: rm .github/scripts/apply_0_11_store.py .github/workflows/apply-0.11-store.yml

      - name: Commit data management changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/bossdeathtracker/BossDeathTrackerStore.java src/main/java/com/bossdeathtracker/BossStatistics.java src/main/java/com/bossdeathtracker/SessionStatistics.java .github/scripts/apply_0_11_store.py .github/workflows/apply-0.11-store.yml
          git commit -m "Add reversible history and profile data tools"
          git push
